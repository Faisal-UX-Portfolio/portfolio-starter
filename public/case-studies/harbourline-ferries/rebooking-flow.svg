<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Demo image: three phone screens showing the rebooking flow">
  <rect width="1600" height="1000" fill="#f0f0f0"/>
  <g font-family="system-ui, sans-serif" fill="#171717">
    <g transform="translate(160 100)">
      <rect width="360" height="780" rx="40" fill="#ffffff" stroke="#171717" stroke-width="4"/>
      <rect x="30" y="80" width="300" height="140" rx="16" fill="#DDF1F2"/>
      <text x="50" y="130" font-size="24" font-weight="700">Sailing cancelled</text>
      <text x="50" y="170" font-size="20">Move to another sailing</text>
      <rect x="30" y="660" width="300" height="70" rx="35" fill="#0E7C86"/>
      <text x="180" y="704" font-size="22" fill="#ffffff" text-anchor="middle">See options</text>
    </g>
    <g transform="translate(620 100)">
      <rect width="360" height="780" rx="40" fill="#ffffff" stroke="#171717" stroke-width="4"/>
      <rect x="30" y="80" width="300" height="110" rx="16" fill="#0E7C86"/>
      <text x="50" y="145" font-size="24" fill="#ffffff" font-weight="700">14:30 · 3 seats</text>
      <rect x="30" y="210" width="300" height="110" rx="16" fill="#DDF1F2"/>
      <text x="50" y="275" font-size="24">16:00 · 12 seats</text>
      <rect x="30" y="340" width="300" height="110" rx="16" fill="#DDF1F2"/>
      <text x="50" y="405" font-size="24">18:15 · 40 seats</text>
    </g>
    <g transform="translate(1080 100)">
      <rect width="360" height="780" rx="40" fill="#ffffff" stroke="#171717" stroke-width="4"/>
      <circle cx="180" cy="260" r="70" fill="#0E7C86"/>
      <path d="M145 262 L172 290 L220 236" fill="none" stroke="#ffffff" stroke-width="12"/>
      <text x="180" y="400" font-size="26" font-weight="700" text-anchor="middle">You are on the 14:30</text>
      <text x="180" y="440" font-size="20" text-anchor="middle">Your old booking is released</text>
    </g>
  </g>
</svg>
