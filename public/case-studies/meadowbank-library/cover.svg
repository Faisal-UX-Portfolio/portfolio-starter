<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Demo image: a stack of books beside a phone">
  <rect width="1600" height="1000" fill="#FFEDD5"/>
  <g transform="translate(360 480)">
    <rect x="0" y="360" width="520" height="80" rx="10" fill="#9A3412"/>
    <rect x="30" y="270" width="470" height="80" rx="10" fill="#C2410C"/>
